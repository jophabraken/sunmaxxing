<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunmaxxing — find the sun in Berlin</title>
<meta name="description" content="Live sun and shade for 4,000+ Berlin terraces. Real building shadows, any time of day.">
<!-- Preview of the 2026 redesign. Not indexed until it replaces the main app. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EBDF">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/data/horizons.json" as="fetch" crossorigin>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/new/app.css?v=202610112144">
</head>
<body>
<div id="app">
  <div id="map"></div>

  <!-- Top bar -->
  <header class="top">
    <button class="search-pill" id="search-open" type="button"><svg viewBox="0 0 20 20" width="16" height="16"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-t="search_ph">Search a place in Berlin</span></button>
    <button class="pill wx" id="wx-chip" type="button" aria-live="polite">—</button>
    <button class="pill lang" id="lang-toggle" type="button">DE</button>
  </header>
  <nav class="chips" id="chips"></nav>

  <!-- Map controls -->
  <div class="map-ctl">
    <button class="round" id="locate" type="button" aria-label="Near me"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2l3.2 18.3L12 17l-3.2 3.3L12 2z" transform="rotate(45 12 12)" fill="currentColor"/></svg></button>
  </div>

  <!-- Sun dial -->
  <section class="dial" id="dial" aria-label="Time of day">
    <div class="dial-days" id="dial-days"></div>
    <svg class="dial-svg" id="dial-svg" aria-hidden="true"></svg>
    <div class="dial-time"><span id="dial-time">—:—</span><button class="now-btn hidden" id="now-btn" type="button" data-t="now">Now</button></div>
    <input class="dial-range" id="dial-range" type="range" min="0" max="1440" step="5" aria-label="Time">
  </section>

  <!-- Sheet / side panel -->
  <section class="sheet" id="sheet" data-state="peek">
    <div class="sheet-grab" id="sheet-grab"><i></i></div>
    <div class="sheet-scroll" id="sheet-scroll">
      <div class="brand"><span class="brand-sun"></span>sunmaxxing <small>· Berlin</small></div>
      <div id="summary"></div>
      <div id="cards" class="cards"></div>
      <div id="list" class="list"></div>
    </div>
  </section>

  <!-- Terrace page -->
  <section class="detail" id="detail" aria-hidden="true">
    <button class="back" id="detail-back" type="button" aria-label="Back">‹</button>
    <div class="detail-scroll" id="detail-body"></div>
  </section>

  <!-- Search -->
  <section class="search" id="search" aria-hidden="true">
    <div class="search-bar"><button class="back" id="search-close" type="button" aria-label="Close">‹</button><input id="search-input" type="search" autocomplete="off" spellcheck="false"></div>
    <div class="search-results" id="search-results"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <div class="loading" id="loading"><div class="sunball"></div></div>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="/vendor/suncalc.js"></script>
<script async src="/vendor/protomaps-leaflet.js" onload="window.__basemapReady && window.__basemapReady()"></script>
<script defer src="/vendor/i18next.min.js"></script>
<script defer src="/vendor/opening_hours.min.js" onload="window.__hoursReady && window.__hoursReady()"></script>
<script src="/new/app.js?v=202610112144"></script>
</body>
</html>
